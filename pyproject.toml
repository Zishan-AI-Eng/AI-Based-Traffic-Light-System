[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-driven-traffic-light-system"
version = "0.1.0"
description = "Deep reinforcement learning traffic-light control with SUMO."
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=0.29,<1.3",
    "numpy>=1.24,<3",
    "sumo-rl>=1.4,<2",
    "torch>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
